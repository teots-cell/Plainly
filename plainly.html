<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plainly — explain this</title>
<meta name="theme-color" content="#1B2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plainly">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    --paper:#FAFAF6;
    --paper-dim:#F0EEE6;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --highlight:#FFD23F;
    --highlight-soft:#FFF3C4;
    --teal:#2E6E62;
    --coral:#E4572E;
    --line:#D8D4C8;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  @font-face{
    font-family:'Space Mono Fallback';
    src:local('Space Mono');
  }
  .mono{
    font-family:'Space Mono', 'Courier New', monospace;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:0 20px 40px;
  }
  header{
    padding:28px 0 18px;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
    position:relative;
  }
  .wordmark{
    font-family:'Space Mono', monospace;
    font-size:22px;
    letter-spacing:-0.5px;
    font-weight:700;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .wordmark span.dot{
    color:var(--highlight);
    -webkit-text-stroke: 1px var(--ink);
  }
  .tagline{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
    font-family:'Space Mono', monospace;
  }

  .lang-row{
    position:absolute;
    top:28px;
    right:0;
  }
  .lang-select{
    font-family:'Space Mono', monospace;
    font-size:12px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:20px;
    padding:7px 12px;
    color:var(--ink);
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%235B6472'/></svg>");
    background-repeat:no-repeat;
    background-position:right 10px center;
    padding-right:26px;
  }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
  }

  /* Upload zone */
  .dropzone{
    border:2px dashed var(--line);
    border-radius:var(--radius);
    background:var(--paper-dim);
    padding:36px 20px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .dropzone .icon{
    font-size:34px;
    margin-bottom:10px;
    display:block;
  }
  .dropzone .cta{
    font-weight:600;
    font-size:16px;
    margin-bottom:4px;
  }
  .dropzone .sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:20px;
  }
  .dz-actions{
    display:flex;
    gap:10px;
  }
  .dz-btn{
    flex:1;
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    font-weight:600;
    padding:13px 10px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    background:var(--ink);
    color:var(--paper);
  }
  .dz-btn-secondary{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--ink);
  }
  input[type=file]{display:none;}

  .preview-wrap{
    margin-top:18px;
    border-radius:var(--radius);
    overflow:hidden;
    border:1px solid var(--line);
    background:#fff;
    position:relative;
  }
  .preview-wrap img{
    width:100%;
    display:block;
    max-height:320px;
    object-fit:contain;
    background:#fff;
  }
  .retake{
    position:absolute;
    top:10px;
    right:10px;
    background:rgba(27,36,48,0.85);
    color:#fff;
    border:none;
    border-radius:20px;
    padding:6px 14px;
    font-size:12px;
    font-family:'Space Mono', monospace;
    cursor:pointer;
  }

  .explain-btn{
    margin-top:18px;
    width:100%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    padding:16px;
    font-size:16px;
    font-weight:600;
    font-family:'Work Sans', sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .explain-btn:disabled{
    opacity:0.5;
  }
  .explain-btn .spin{
    width:16px;height:16px;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 0.7s linear infinite;
    display:none;
  }
  .loading .spin{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Style chips */
  .chips{
    display:flex;
    gap:8px;
    margin-top:22px;
    flex-wrap:wrap;
  }
  .chip{
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s;
  }
  .chip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  /* Result */
  .result{
    margin-top:20px;
    display:none;
  }
  .result.show{display:block;}
  .result-label{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .result-label::before{
    content:'';
    width:8px;height:8px;
    background:var(--teal);
    border-radius:50%;
    display:inline-block;
  }
  .result-text{
    font-size:16px;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .result-text .hl{
    background:linear-gradient(100deg, transparent 0%, var(--highlight) 8%, var(--highlight) 92%, transparent 100%);
    background-size:0% 100%;
    background-repeat:no-repeat;
    animation:sweep 0.6s ease-out forwards;
    animation-delay:var(--d, 0s);
    padding:1px 2px;
    border-radius:3px;
  }
  @keyframes sweep{
    to{ background-size:100% 100%; }
  }

  .error{
    margin-top:16px;
    background:#FBEAE4;
    border:1px solid var(--coral);
    color:var(--coral);
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    display:none;
  }
  .error.show{display:block;}

  footer{
    margin-top:auto;
    padding-top:30px;
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    font-family:'Space Mono', monospace;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">plain<span class="dot">ly</span></div>
    <div class="tagline">point your camera at anything confusing</div>
    <div class="lang-row">
      <select class="lang-select" id="langSelect">
        <option value="English">EN</option>
        <option value="Greek">EL</option>
        <option value="Spanish">ES</option>
        <option value="French">FR</option>
        <option value="German">DE</option>
        <option value="Italian">IT</option>
        <option value="Portuguese">PT</option>
        <option value="Polish">PL</option>
        <option value="Lithuanian">LT</option>
        <option value="Russian">RU</option>
        <option value="Turkish">TR</option>
        <option value="Arabic">AR</option>
        <option value="Chinese">ZH</option>
        <option value="Japanese">JA</option>
        <option value="Hindi">HI</option>
      </select>
    </div>
  </header>

  <div class="stage">
    <div id="dropzone" class="dropzone">
      <span class="icon">&#128248;</span>
      <div class="cta">Photograph anything confusing</div>
      <div class="sub">a bill, a form, a menu, a letter — anything</div>
      <div class="dz-actions">
        <button type="button" class="dz-btn" id="takePhotoBtn">Take photo</button>
        <button type="button" class="dz-btn dz-btn-secondary" id="uploadBtn">Upload photo</button>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment">
      <input type="file" id="libraryInput" accept="image/*">
    </div>

    <div id="previewWrap" class="preview-wrap" style="display:none;">
      <img id="previewImg" src="" alt="preview">
      <button class="retake" id="retakeBtn">retake</button>
    </div>

    <button id="explainBtn" class="explain-btn" style="display:none;">
      <span class="spin"></span>
      <span id="explainBtnText">Explain this</span>
    </button>

    <div class="chips" id="chips" style="display:none;">
      <div class="chip active" data-style="simple">Simple</div>
      <div class="chip" data-style="kid">Like I'm 5</div>
      <div class="chip" data-style="detailed">Detailed</div>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="result" id="result">
      <div class="result-label">Here's what this is</div>
      <div class="result-text" id="resultText"></div>
    </div>
  </div>

  <footer>plainly &middot; explains, doesn't store</footer>
</div>

<script>
let currentImageBase64 = null;
let currentMediaType = null;
let currentStyle = 'simple';
let currentLang = 'English';

const langSelect = document.getElementById('langSelect');
const LANG_CODE_MAP = {
  en:'English', el:'Greek', es:'Spanish', fr:'French', de:'German',
  it:'Italian', pt:'Portuguese', pl:'Polish', lt:'Lithuanian', ru:'Russian',
  tr:'Turkish', ar:'Arabic', zh:'Chinese', ja:'Japanese', hi:'Hindi'
};
(function setDefaultLang(){
  const browserLang = (navigator.language || 'en').slice(0,2).toLowerCase();
  const guess = LANG_CODE_MAP[browserLang];
  if(guess){
    currentLang = guess;
    const opt = Array.from(langSelect.options).find(o => o.value === guess);
    if(opt) langSelect.value = guess;
  }
})();
langSelect.addEventListener('change', () => {
  currentLang = langSelect.value;
  if(currentImageBase64 && result.classList.contains('show')) runExplain();
});

const dropzone = document.getElementById('dropzone');
const takePhotoBtn = document.getElementById('takePhotoBtn');
const uploadBtn = document.getElementById('uploadBtn');
const cameraInput = document.getElementById('cameraInput');
const libraryInput = document.getElementById('libraryInput');
const previewWrap = document.getElementById('previewWrap');
const previewImg = document.getElementById('previewImg');
const retakeBtn = document.getElementById('retakeBtn');
const explainBtn = document.getElementById('explainBtn');
const explainBtnText = document.getElementById('explainBtnText');
const chips = document.getElementById('chips');
const result = document.getElementById('result');
const resultText = document.getElementById('resultText');
const errorBox = document.getElementById('errorBox');

takePhotoBtn.addEventListener('click', () => cameraInput.click());
uploadBtn.addEventListener('click', () => libraryInput.click());

function handleFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = reader.result;
    currentMediaType = file.type || 'image/jpeg';
    currentImageBase64 = dataUrl.split(',')[1];
    previewImg.src = dataUrl;
    dropzone.style.display = 'none';
    previewWrap.style.display = 'block';
    explainBtn.style.display = 'flex';
    chips.style.display = 'none';
    result.classList.remove('show');
    errorBox.classList.remove('show');
  };
  reader.readAsDataURL(file);
}

cameraInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
libraryInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

retakeBtn.addEventListener('click', () => {
  currentImageBase64 = null;
  previewWrap.style.display = 'none';
  dropzone.style.display = 'block';
  explainBtn.style.display = 'none';
  chips.style.display = 'none';
  result.classList.remove('show');
  cameraInput.value = '';
  libraryInput.value = '';
});

chips.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentStyle = chip.dataset.style;
  runExplain();
});

explainBtn.addEventListener('click', runExplain);

function stylePrompt(style){
  if(style === 'kid') return "Explain it the way you'd explain it to a curious 6 year old — short, friendly, simple words, maybe one gentle analogy. Still accurate.";
  if(style === 'detailed') return "Give a thorough but still plain-language explanation — cover every line item or section, note anything unusual or worth double-checking, but avoid jargon.";
  return "Explain it simply and clearly in a few short sentences, like a smart friend reading it over your shoulder. Plain language, no jargon.";
}

async function runExplain(){
  if(!currentImageBase64) return;
  explainBtn.disabled = true;
  explainBtn.classList.add('loading');
  explainBtnText.textContent = 'Reading it...';
  errorBox.classList.remove('show');

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [
          {
            role: "user",
            content: [
              {
                type: "image",
                source: { type: "base64", media_type: currentMediaType, data: currentImageBase64 }
              },
              {
                type: "text",
                text: "This is a photo of a document, form, bill, menu, sign, or message that a person found confusing. It may be in any language, including one the person doesn't read. " + stylePrompt(currentStyle) + " Do not just transcribe it — interpret it. If there's something the person should pay attention to, act on, or be careful about, mention it plainly at the end. Write your entire response in " + currentLang + ", regardless of what language the original document is in."
              }
            ]
          }
        ]
      })
    });

    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    const explanation = textBlock ? textBlock.text : "Couldn't quite read that one — try a clearer photo.";

    renderResult(explanation);
    chips.style.display = 'flex';
    explainBtnText.textContent = 'Re-explain';
  }catch(err){
    errorBox.textContent = "Something went wrong reading that image. Try again with a clearer photo.";
    errorBox.classList.add('show');
  }finally{
    explainBtn.disabled = false;
    explainBtn.classList.remove('loading');
  }
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

function renderResult(text){
  resultText.innerHTML = '';
  const words = text.split(/(\s+)/);
  let delay = 0;
  const chunkSize = 3;
  let buffer = [];
  let count = 0;

  words.forEach((w) => {
    buffer.push(w);
    if(w.trim() !== '') count++;
    if(count >= chunkSize && w.trim() !== ''){
      const span = document.createElement('span');
      span.className = 'hl';
      span.style.setProperty('--d', delay + 's');
      span.textContent = buffer.join('');
      resultText.appendChild(span);
      buffer = [];
      count = 0;
      delay += 0.08;
    }
  });
  if(buffer.length){
    const span = document.createElement('span');
    span.className = 'hl';
    span.style.setProperty('--d', delay + 's');
    span.textContent = buffer.join('');
    resultText.appendChild(span);
  }
  result.classList.add('show');
}
</script>
</body>
</html>
